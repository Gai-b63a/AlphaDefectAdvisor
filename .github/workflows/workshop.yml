name: Steam Workshop

on:
  workflow_dispatch:
  push:
    tags: ['workshop-v*']
    paths: ['.github/workflows/workshop.yml', 'advisor/**', 'tests/**', 'tools/**', '.github/runtime/**']
    branches: [main]

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      # Training archives outside these paths contain names Windows cannot check out.
      - uses: actions/checkout@v4
        with:
          repository: hmty-CHEN/AlphaDefect-Public
          ref: 800db3039162647bf0ad13ed379f155cc5806f5f
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine/Sts2Headless/
            /engine/game_version.txt
            /python/
            /tools/ability_test.py
      - name: Stage upstream build inputs
        run: |
          mkdir -p source/engine source/tools
          cp -R engine/Sts2Headless engine/game_version.txt source/engine/
          cp -R python source/
          cp tools/ability_test.py source/tools/
          test -s source/engine/Sts2Headless/Engine/RunSession.cs
          test -s source/python/sts2rl/model.py
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: source/
          if-no-files-found: error
          retention-days: 14

  mac-runtime:
    needs: upstream
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: upstream
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.12'
      - name: Package relocatable Apple Silicon interpreter and CPU model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download weights-v6 --repo hmty-CHEN/AlphaDefect-Public --pattern ironclad_ema_v24782.pt
          uv python install 3.12.12
          "$(uv python find --managed-python 3.12.12)" -I .github/runtime/build_macos_runtime.py artifact/osx-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-runtime-${{ github.sha }}
          path: artifact/osx-arm64.zip
          compression-level: 0
          retention-days: 2

  runtime:
    needs: [upstream, mac-runtime]
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download official model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download weights-v6 --repo hmty-CHEN/AlphaDefect-Public --pattern ironclad_ema_v24782.pt
      - uses: actions/download-artifact@v4
        with:
          name: mac-runtime-${{ github.sha }}
          path: platforms
      - name: Build private CPU runtime and assemble both platforms
        run: |
          python -I .github/runtime/build_runtime.py platforms/win-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifact | Out-Null
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path platforms), "$pwd/artifact/runtime.zip", [IO.Compression.CompressionLevel]::NoCompression, $false)
      - name: Verify payload and record source revision
        run: |
          ./tools/package/Test-WorkshopPackage.ps1 -Runtime artifact/runtime.zip
          @{ commit = $env:GITHUB_SHA; sha256 = (Get-FileHash artifact/runtime.zip).Hash } |
            ConvertTo-Json | Set-Content -Encoding utf8 artifact/runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-runtime-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  vm-runtime-test:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the five versioned tables for the simulated first download
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/hmty-CHEN/AlphaDefect-Public/800db3039162647bf0ad13ed379f155cc5806f5f'
          foreach ($name in 'engine/catalog/vocab.txt','engine/catalog/aliases.txt','engine/catalog/no_downside_relics.txt','engine/catalog/v0.113.1/catalog.json','python/sts2rl/enchant_effects.json') {
            $file = Join-Path fixtures $name
            New-Item -ItemType Directory -Force (Split-Path $file) | Out-Null
            Invoke-WebRequest "$base/$name" -OutFile $file
          }
      - uses: actions/download-artifact@v4
        with:
          name: workshop-runtime-${{ github.sha }}
          path: package
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install into a clean user directory and start the packaged model offline
        shell: pwsh
        run: |
          $env:PROBE_PAYLOAD_HASH = (Get-FileHash package/runtime.zip).Hash
          dotnet build tests/runtime/RuntimeCheck.csproj -c Release -p:VmProbe=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cache = Join-Path $env:RUNNER_TEMP 'Advisor VM'
          if ($IsWindows) { $cache = Join-Path $cache (('profile-' * 10) + '/' + ('cache-' * 14)) }
          python3 -I tests/runtime/replay_seed.py dotnet tests/runtime/bin/Release/net9.0/RuntimeCheck.dll package fixtures "$cache"

  release:
    if: github.ref == 'refs/heads/main'
    needs: [upstream, runtime, vm-runtime-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: workshop-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: upstream
      - uses: actions/download-artifact@v4
        with:
          name: workshop-runtime-${{ github.sha }}
          path: artifact
      - name: Publish versioned build inputs for the local updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' advisor/AlphaDefectAdvisor.json)
          tag="advisor-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version $version already has a release."
            exit 0
          fi
          git archive --format=zip --output=artifact/build-source.zip HEAD
          zip -qr artifact/build-source.zip upstream/engine/Sts2Headless
          gh release create "$tag" artifact/build-source.zip artifact/runtime.zip --target "$GITHUB_SHA" --title "AlphaDefect Advisor $version" --notes "Build inputs for the local Workshop updater."
