name: Steam Workshop

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Steam Workshop operation
        type: choice
        required: true
        default: prepare
        options: [prepare, update]
  push:
    tags: ['workshop-v*']
    paths: ['.github/workflows/workshop.yml', 'advisor/AlphaDefectAdvisor.json']
    branches: [main]

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.select.outputs.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BEFORE: ${{ github.event.before }}
          OPERATION: ${{ inputs.operation }}
        shell: python
        run: |
          import json, os, re, subprocess
          from pathlib import Path
          manifest = "advisor/AlphaDefectAdvisor.json"
          update = False
          if os.environ["GITHUB_REF"] == "refs/heads/main":
              if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
                  update = os.environ["OPERATION"] == "update"
              elif os.environ["BEFORE"].strip("0"):
                  previous = json.loads(subprocess.check_output(["git", "show", os.environ["BEFORE"] + ":" + manifest]))
                  current = json.loads(Path(manifest).read_bytes())
                  def version(value):
                      if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", value):
                          raise ValueError("Expected major.minor.patch in the mod manifest")
                      return tuple(map(int, value.split(".")))
                  update = version(current["version"]) > version(previous["version"])
          if update:
              target = Path("workshop/mod_id.txt")
              value = target.read_text(encoding="utf-8-sig").strip() if target.exists() else ""
              if not re.fullmatch(r"[1-9][0-9]{0,19}", value) or int(value) >= 2**64:
                  raise ValueError("Register the manually created item in workshop/mod_id.txt before releasing")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("update=" + str(update).lower(), file=out)

  upstream:
    runs-on: ubuntu-latest
    steps:
      # Training archives outside these paths contain names Windows cannot check out.
      - uses: actions/checkout@v4
        with:
          repository: hmty-CHEN/AlphaDefect-Public
          ref: 800db3039162647bf0ad13ed379f155cc5806f5f
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine/Sts2Headless/
            /engine/game_version.txt
            /python/
            /tools/ability_test.py
      - name: Stage upstream build inputs
        run: |
          mkdir -p source/engine source/tools
          cp -R engine/Sts2Headless engine/game_version.txt source/engine/
          cp -R python source/
          cp tools/ability_test.py source/tools/
          test -s source/engine/Sts2Headless/Engine/RunSession.cs
          test -s source/python/sts2rl/model.py
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: source/
          if-no-files-found: error
          retention-days: 14

  runtime:
    needs: upstream
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download official model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download weights-v6 --repo hmty-CHEN/AlphaDefect-Public --pattern ironclad_ema_v24782.pt
      - name: Build private CPU runtime
        run: python -I tools/build_runtime.py artifact/runtime.zip
      - name: Verify payload and record source revision
        run: |
          python -I tools/check_workshop.py --runtime artifact/runtime.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @{ commit = $env:GITHUB_SHA; sha256 = (Get-FileHash artifact/runtime.zip).Hash } |
            ConvertTo-Json | Set-Content -Encoding utf8 artifact/runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-runtime-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: needs.target.outputs.update == 'true'
    needs: [runtime, target]
    runs-on: windows-2022
    timeout-minutes: 50
    environment: steam-workshop
    concurrency:
      group: steam-workshop-publication
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: workshop-runtime-${{ github.sha }}
          path: artifact
      - name: Install Valve SteamCMD
        run: |
          $dir = Join-Path $env:RUNNER_TEMP steamcmd
          $zip = Join-Path $env:RUNNER_TEMP steamcmd.zip
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile $zip
          Expand-Archive $zip $dir
          $exe = Join-Path $dir steamcmd.exe
          # The bootstrapper may exit nonzero after spawning its updated client.
          # Wait for that process tree before checking the installed client again.
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            $client = Start-Process -FilePath $exe -ArgumentList '+quit' -WorkingDirectory $dir -WindowStyle Hidden -Wait -PassThru
            if ($client.ExitCode -eq 0) { break }
            Write-Host "SteamCMD startup attempt $attempt returned exit code $($client.ExitCode)."
            if ($attempt -eq 4) { throw "SteamCMD did not initialize after $attempt attempts (exit $($client.ExitCode))." }
            Start-Sleep -Seconds 3
          }
          "STEAMCMD=$exe" >> $env:GITHUB_ENV
      - name: Sign in and obtain matching game assemblies
        id: depot
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: python -I tools/steam_release.py download "$env:STEAMCMD"
      - name: Build and verify Workshop package
        env:
          GAME_DIR: ${{ steps.depot.outputs.game }}
        run: |
          ./Build-Advisor.ps1 -GameAssemblyDir $env:GAME_DIR -RuntimeArtifactDir artifact
          ./Publish-Workshop.ps1 -Mode Check
      - name: Submit to Steam Workshop
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          git fetch --no-tags origin main
          if ($LASTEXITCODE) { throw 'Could not verify the current main release' }
          git diff --quiet FETCH_HEAD HEAD -- workshop/mod_id.txt advisor/AlphaDefectAdvisor.json
          if ($LASTEXITCODE) { throw 'Workshop ID or mod manifest changed. Skipping stale upload.' }
          python -I tools/steam_release.py update "$env:STEAMCMD"
