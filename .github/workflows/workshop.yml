name: Steam Workshop

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Steam Workshop operation
        type: choice
        required: true
        default: prepare
        options: [prepare, create, update]
  push:
    tags: ['workshop-v*']
    paths: ['.github/workflows/workshop.yml']
    branches: [main]

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      # Training archives outside these paths contain names Windows cannot check out.
      - uses: actions/checkout@v4
        with:
          repository: hmty-CHEN/AlphaDefect-Public
          ref: 800db3039162647bf0ad13ed379f155cc5806f5f
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine/Sts2Headless/
            /engine/game_version.txt
            /python/
            /tools/ability_test.py
      - name: Stage upstream build inputs
        run: |
          mkdir -p source/engine source/tools
          cp -R engine/Sts2Headless engine/game_version.txt source/engine/
          cp -R python source/
          cp tools/ability_test.py source/tools/
          test -s source/engine/Sts2Headless/Engine/RunSession.cs
          test -s source/python/sts2rl/model.py
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: source/
          if-no-files-found: error
          retention-days: 14

  runtime:
    needs: upstream
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download official model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download weights-v6 --repo hmty-CHEN/AlphaDefect-Public --pattern ironclad_ema_v24782.pt
      - name: Build private CPU runtime
        run: python -I tools/build_runtime.py artifact/runtime.zip
      - name: Verify payload and record source revision
        run: |
          python -I tools/check_workshop.py --runtime artifact/runtime.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @{ commit = $env:GITHUB_SHA; sha256 = (Get-FileHash artifact/runtime.zip).Hash } |
            ConvertTo-Json | Set-Content -Encoding utf8 artifact/runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-runtime-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'create' || inputs.operation == 'update')
    needs: runtime
    runs-on: windows-2022
    timeout-minutes: 50
    environment: steam-workshop
    concurrency:
      group: steam-workshop-publication
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-source-${{ github.sha }}
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: workshop-runtime-${{ github.sha }}
          path: artifact
      - name: Install Valve SteamCMD
        run: |
          $dir = Join-Path $env:RUNNER_TEMP steamcmd
          $zip = Join-Path $env:RUNNER_TEMP steamcmd.zip
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile $zip
          Expand-Archive $zip $dir
          $exe = Join-Path $dir steamcmd.exe
          & $exe +quit
          if ($LASTEXITCODE) { throw "SteamCMD initialization failed" }
          "STEAMCMD=$exe" >> $env:GITHUB_ENV
      - name: Sign in and obtain matching game assemblies
        id: depot
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: python -I tools/steam_release.py download "$env:STEAMCMD"
      - name: Build and verify Workshop package
        env:
          GAME_DIR: ${{ steps.depot.outputs.game }}
        run: |
          ./Build-Advisor.ps1 -GameAssemblyDir $env:GAME_DIR -RuntimeArtifactDir artifact
          ./Publish-Workshop.ps1 -Mode Check
      - name: Submit to Steam Workshop
        env:
          ACTION_MODE: ${{ inputs.operation }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/steam_release.py "$env:ACTION_MODE" "$env:STEAMCMD"
